/* ---- tokens ------------------------------------------------------- */
:root {
  --bg:      #000000;
  --surface: #0D0D0D;
  --panel:   #111111;
  --text:    #EDEDED;
  --muted:   #9A9A9A;
  --dim:     #666666;
  --accent:  #E5E418;
  --hairline: rgba(255, 255, 255, .10);
  --hairline-strong: rgba(255, 255, 255, .16);

  --font-display: 'Anton', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --gutter: clamp(1.25rem, 5vw, 6rem);
  --wrap: 1360px;
  --sec-y: clamp(5rem, 11vw, 10rem);

  --ease: cubic-bezier(.22, 1, .36, 1);
}

/* ---- reset -------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: .9375rem;
  line-height: 1.7;
  font-weight: 400;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; height: auto; }
ul { list-style: none; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4, p, figure { margin: 0; }

::selection { background: var(--accent); color: #000; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--accent); color: #000; padding: .75rem 1.25rem;
  font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.skip-link:focus { left: 0; }

/* ---- primitives --------------------------------------------------- */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.section {
  position: relative;
  padding-block: var(--sec-y);
  border-top: 1px solid var(--hairline);
}

/* tiny wide-tracked caps label — the reference's core device */
.tag-label {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--muted);
}
.tag-label::before {
  content: "";
  width: 5px; height: 5px;
  background: var(--accent);
}

/* clean sentence-case section heading */
.section-head { margin-bottom: clamp(2.5rem, 6vw, 4rem); }
.section-head h2 {
  font-size: clamp(1.75rem, 3.2vw, 2.5rem);
  font-weight: 500;
  letter-spacing: -.01em;
  line-height: 1.15;
  margin-top: 1rem;
}
.section-head p {
  color: var(--muted);
  max-width: 52ch;
  margin-top: .75rem;
  font-size: .9375rem;
}

.link-grow {
  position: relative;
  display: inline-block;
}
.link-grow::after {
  content: "";
  position: absolute;
  left: 0; bottom: -.1em;
  width: 100%;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .4s var(--ease);
}
.link-grow:hover::after,
.link-grow:focus-visible::after { transform: scaleX(1); }

/* small caps action link — quiet until hovered, so yellow stays rare */
.action {
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color .3s var(--ease);
}
.action:hover { color: var(--accent); }

/* solid yellow chip button */
.btn {
  display: inline-block;
  padding: .9rem 1.75rem;
  background: var(--accent);
  border: 0;
  color: #0A0A0A;
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.btn:hover, .btn:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(229, 228, 24, .18);
}
.btn[disabled] { opacity: .55; cursor: progress; transform: none; box-shadow: none; }

/* ---- nav ---------------------------------------------------------- */
.nav {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  padding: .9rem var(--gutter);
  background: linear-gradient(to bottom, rgba(0, 0, 0, .94), rgba(0, 0, 0, .8));
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--hairline);
  transition: transform .4s var(--ease);
}
.nav.is-hidden { transform: translateY(-110%); }

.nav__mark {
  font-family: var(--font-display);
  font-size: 1.125rem;
  letter-spacing: .08em;
}

/* Section links and the social link share one row and one type spec, so
   nothing in the bar reads as a different size or weight. */
.nav__end {
  display: flex;
  align-items: center;
  gap: clamp(1.25rem, 2.5vw, 2.75rem);
}

.nav__links,
.nav__platforms {
  display: flex;
  align-items: center;
  gap: clamp(1.25rem, 2.5vw, 2.75rem);
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--muted);
}
.nav__links a,
.nav__platforms a { transition: color .3s var(--ease); }
.nav__links a:hover { color: var(--text); }
.nav__platforms a:hover { color: var(--accent); }

@media (max-width: 719px) {
  .nav { gap: .75rem; }
  .nav__end,
  .nav__links,
  .nav__platforms {
    gap: .95rem;
    font-size: .5625rem;
    letter-spacing: .14em;
  }
}


/* ---- hero ---------------------------------------------------------
   The section is two viewports tall and the stage sticks to the top of
   the first one, so the artwork dissolves in place (hero-dissolve.js)
   rather than scrolling out of frame. The image is capped so it never
   renders above its native pixel size. */
.hero {
  position: relative;
  min-height: 200svh;                 /* 1 screen of hero + 1 of pinned scroll */
}

/* Note: no overflow on .hero — an overflow ancestor would turn the stage's
   sticky into a no-op. The clipping the glow needs lives on the stage. */
.hero__stage {
  position: sticky;
  top: 0;
  height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 5rem var(--gutter) 2rem;   /* clears the fixed nav */
  text-align: center;
  overflow: hidden;                   /* the glow never widens the page */
}

/* everything but the artwork fades out as the dissolve finishes, so the
   stage is empty by the time it unpins — driven by hero-dissolve.js */
.hero__content,
.hero__cue,
.hero__meta { opacity: var(--hero-fade, 1); }

/* ---- edge metadata ------------------------------------------------- */
.hero__meta {
  position: absolute;
  top: 50%;
  display: flex;
  align-items: center;
  gap: .9rem;
  margin: 0;
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--dim);
  white-space: nowrap;
}
.hero__meta em { font-style: normal; color: var(--accent); }
.hero__meta-rule {
  width: 2.5rem;
  height: 1px;
  background: currentColor;
  opacity: .5;
}
/* rotated so they run up the left and right margins */
.hero__meta--left {
  left: 0;
  transform: translate(calc(-50% + 1.25rem), -50%) rotate(-90deg);
}
.hero__meta--right {
  right: 0;
  flex-direction: row-reverse;
  transform: translate(calc(50% - 1.25rem), -50%) rotate(90deg);
}
@media (max-width: 899px) {
  /* the artwork already fills a phone screen; edge labels would crowd it */
  .hero__meta { display: none; }
}

/* the artwork holds still; scroll dissolves it into particles (hero-dissolve.js).
   A faint static accent glow sits behind it for depth. */
.hero__art {
  position: relative;
  z-index: 1;                         /* the wordmark overlaps it, above */
  display: flex;
  justify-content: center;
  margin: 0;
}
.hero__art::before {
  content: "";
  position: absolute;
  inset: -14%;
  z-index: -1;
  background: radial-gradient(closest-side, rgba(229, 228, 24, .10), transparent 72%);
  filter: blur(18px);
  /* fades with the particles, or it is left glowing over an empty stage */
  opacity: var(--art-glow, 1);
}
.hero__art-img {
  display: block;
  height: min(52svh, 470px);
  width: auto;
  max-width: 88vw;
}
/* the particle canvas is positioned and sized entirely by JS */
.hero__art canvas { display: block; pointer-events: none; }

/* Lifted into the artwork so the two read as one composition instead of
   two stacked blocks. The foot of the artwork is thin drips fading to
   black, so the wordmark sits over it cleanly. */
.hero__content {
  position: relative;
  z-index: 2;
  width: 100%;
  margin-top: clamp(-3.25rem, -5vh, -1.5rem);
}

.hero__mark {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(3.5rem, 14vw, 8rem);
  line-height: .84;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--text);
}

.hero__sub {
  color: var(--muted);
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .28em;
  text-transform: uppercase;
  margin-top: .9rem;
}

@media (min-width: 900px) {
  .hero__art-img { height: min(58svh, 560px); }
  .hero__mark { font-size: clamp(5rem, 10vw, 9.5rem); }
  .hero__content { margin-top: clamp(-4.5rem, -6vh, -2rem); }
}

/* ---- ticker: the one moving element ------------------------------- */
.ticker {
  overflow: hidden;
  border-block: 1px solid var(--hairline);
  padding-block: .85rem;
}
.ticker__track {
  display: flex;
  width: max-content;
  animation: ticker 36s linear infinite;
}
.ticker__track span {
  white-space: nowrap;
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--dim);
}
@keyframes ticker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* scroll cue — sits in flow under the hero, never over the type */
.hero__cue {
  display: flex;
  align-self: center;
  margin-top: clamp(1rem, 3vh, 2rem);
  flex-direction: column;
  align-items: center;
  gap: .6rem;
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color .3s var(--ease);
}
.hero__cue:hover { color: var(--accent); }
.hero__cue-line {
  width: 1px;
  height: 34px;
  background: linear-gradient(to bottom, currentColor, transparent);
  animation: cue-line 2.4s var(--ease) infinite;
  transform-origin: top;
}
@keyframes cue-line {
  0%   { transform: scaleY(0); opacity: 0; }
  40%  { transform: scaleY(1); opacity: 1; }
  100% { transform: scaleY(1) translateY(30px); opacity: 0; }
}

/* ---- label (oscillator) ------------------------------------------- */
.oscillator__wordmark {
  width: min(100%, 30rem);
  height: auto;
  margin-top: 1.25rem;
}

.oscillator__desc {
  color: var(--muted);
  max-width: 52ch;
  margin-top: 1.5rem;
}
.oscillator__link {
  display: inline-block;
  margin-top: 1.75rem;
}

/* the label's own two links */
.oscillator__links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .75rem;
  margin-top: clamp(2.5rem, 6vw, 4rem);
}

/* outlined variant — the solid yellow button stays reserved for the
   page's single primary action */
.btn--ghost {
  background: transparent;
  border: 1px solid var(--hairline-strong);
  color: var(--text);
  transition: border-color .3s var(--ease), color .3s var(--ease);
}
.btn--ghost:hover, .btn--ghost:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  transform: none;
  box-shadow: none;
}



/* ---- music -------------------------------------------------------- */
.music__more {
  margin-top: clamp(2.5rem, 5vw, 4rem);
  display: flex;
  justify-content: center;
}

/* featured player */
.player { margin-top: clamp(2rem, 4.5vw, 3.5rem); }
.player__frame {
  position: relative;
  min-height: 166px;
  background: var(--surface);
  border: 1px solid var(--hairline);
}
.player__frame iframe { display: block; width: 100%; border: 0; }

.player__facade {
  display: flex;
  align-items: center;
  gap: clamp(1rem, 3vw, 2rem);
  min-height: 166px;
  padding: 1.25rem clamp(1rem, 3vw, 2rem);
}
.player__play {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .8rem;
  flex-shrink: 0;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--accent);
  border: 0;
  cursor: pointer;
  transition: transform .3s var(--ease);
}
.player__play:hover, .player__play:focus-visible { transform: scale(1.06); }
.player__icon {
  width: 0; height: 0;
  border-style: solid;
  border-width: 9px 0 9px 14px;
  border-color: transparent transparent transparent #0A0A0A;
  margin-left: 3px;
}
.player__cta {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
.player__meta { min-width: 0; }
.player__eyebrow {
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--dim);
}
.player__track {
  font-size: 1.125rem;
  font-weight: 500;
  margin-top: .3rem;
}
.player__out {
  display: inline-block;
  margin-top: .6rem;
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color .3s var(--ease);
}
.player__out:hover { color: var(--accent); }
.player__fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 166px;
  color: var(--dim);
  font-size: .6875rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* release grid — reference card anatomy: cover, one-line title,
   artist, then genre tag + descriptors */
.grid--releases {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: clamp(1.5rem, 3vw, 2.25rem);
  margin-top: clamp(2.5rem, 5vw, 4rem);
}
@media (min-width: 720px) {
  .grid--releases { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}

.card { display: block; }
.card__media {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  background: var(--surface);
  margin-bottom: .9rem;
}
.card__media img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: grayscale(1) contrast(1.08);
  transition: transform .7s var(--ease), filter .7s var(--ease);
}
.card:hover .card__media img,
.card:focus-within .card__media img {
  transform: scale(1.05);
  filter: grayscale(0) contrast(1.05);
}
.card__year {
  position: absolute;
  top: .6rem; right: .6rem;
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .18em;
  color: var(--muted);
  background: rgba(0, 0, 0, .78);
  padding: .2rem .5rem;
}

/* two quiet lines under each cover, both clamped to one line so every
   card in the row ends at the same baseline */
.card__title {
  font-size: .9375rem;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card__meta {
  display: flex;
  gap: .55rem;
  align-items: baseline;
  margin-top: .35rem;
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
}
.card__meta span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.card__meta em { font-style: normal; color: var(--muted); }
.card__meta span { color: var(--dim); }

/* ---- full-bleed photo band ---------------------------------------- */
.band {
  overflow: hidden;
  border-block: 1px solid var(--hairline);
}
.band img {
  width: 100%;
  height: clamp(200px, 34vw, 420px);
  object-fit: cover;
  object-position: center 42%;
}

/* ---- shows -------------------------------------------------------- */
.events { border-top: 1px solid var(--hairline); }

.event {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: .3rem 1.25rem;
  align-items: center;
  padding: 1.4rem 0;
  border-bottom: 1px solid var(--hairline);
  transition: background .35s var(--ease), padding .35s var(--ease);
}
@media (min-width: 860px) {
  .event {
    grid-template-columns: 6rem minmax(0, 1fr) minmax(0, 15rem) auto;
    gap: 2rem;
  }
  .event:hover { background: rgba(255, 255, 255, .025); padding-inline: .75rem; }
}

.event__date { line-height: 1.1; }
.event__day {
  display: block;
  font-size: 1.625rem;
  font-weight: 500;
}
.event__month {
  display: block;
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--dim);
  margin-top: .15rem;
}

.event__title {
  font-size: .9375rem;
  font-weight: 500;
  line-height: 1.35;
}
.event__artist {
  font-size: .75rem;
  color: var(--dim);
  margin-top: .1rem;
}

.event__place {
  grid-column: 2;
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.event__city { color: var(--text); }
.event__country { color: var(--dim); margin-left: .5rem; }
@media (min-width: 860px) { .event__place { grid-column: auto; } }

.event__action { grid-column: 2; justify-self: start; margin-top: .4rem; }
@media (min-width: 860px) { .event__action { grid-column: auto; justify-self: end; margin-top: 0; } }

.tag--soldout {
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
  text-decoration: line-through;
}
.tag--free {
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
}

.events__empty {
  color: var(--dim);
  font-size: .6875rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* No dates announced yet. The heading keeps the same stacked treatment
   as every other section — only the vertical padding tightens, so the
   section does not hold a screen of empty black. */
.shows--empty { padding-block: clamp(3rem, 7vw, 5rem); }
.shows--empty .section-head { margin-bottom: 1.5rem; }
.shows--empty .events { border-top: 0; }

/* ---- contact ------------------------------------------------------ */
.booking__grid {
  display: grid;
  gap: clamp(2.5rem, 6vw, 5rem);
}
@media (min-width: 960px) {
  .booking__grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
}

/* portrait shown as shot — natural aspect, no grade */
.booking__portrait { max-width: 24rem; }
.booking__portrait img { width: 100%; height: auto; }

.booking__name {
  font-size: clamp(1.5rem, 3vw, 2.25rem);
  font-weight: 500;
  letter-spacing: -.01em;
  margin-top: 2rem;
}
.booking__intro .bio-text {
  color: var(--muted);
  margin-top: 1rem;
  max-width: 48ch;
}

.socials {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem 1.5rem;
  margin-top: 1.25rem;
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.socials a { color: var(--dim); transition: color .3s var(--ease); }
.socials a:hover { color: var(--accent); }

/* form */
.form {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: .9rem;
  background: var(--surface);
  border: 1px solid var(--hairline);
  padding: clamp(1.1rem, 2vw, 1.5rem);
  max-width: 30rem;      /* the form no longer fills the whole column */
}
.form__title {
  grid-column: span 2;
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: .65rem;
  border-bottom: 1px solid var(--hairline);
}

.field { grid-column: span 2; display: flex; flex-direction: column; gap: .35rem; }
.field--half { grid-column: span 2; }
@media (min-width: 560px) { .field--half { grid-column: span 1; } }

.field label {
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--dim);
}
.field input,
.field textarea {
  background: #0C0C0C;
  border: 1px solid var(--hairline-strong);
  padding: .6rem .8rem;
  color: var(--text);
  font-size: .8125rem;
  border-radius: 0;
  width: 100%;
  transition: border-color .3s var(--ease);
}
.field textarea { resize: vertical; min-height: 5.5rem; }
.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.field input[aria-invalid="true"],
.field textarea[aria-invalid="true"] { border-color: #ff5d5d; }

.form .btn { grid-column: span 2; justify-self: start; padding: .75rem 1.5rem; }
.form__status {
  grid-column: span 2;
  font-size: .6875rem;
  letter-spacing: .1em;
  color: var(--muted);
  min-height: 1.2em;
}
.form__status.is-ok { color: var(--accent); }
.form__status.is-err { color: #ff7b7b; }

/* ---- footer ------------------------------------------------------- */
.footer {
  border-top: 1px solid var(--hairline);
  padding-block: clamp(3.5rem, 8vw, 6rem) 2rem;
  text-align: center;
}
.footer__grid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}
.footer__mark {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.25rem);
  line-height: .9;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.footer__stamp {
  width: 3.25rem;
  height: auto;
  opacity: .9;
}
.socials--footer { justify-content: center; margin-top: 0; }

.footer__credit {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 1rem;
  margin-top: clamp(2.5rem, 6vw, 4rem);
  padding-top: 1.4rem;
  border-top: 1px solid var(--hairline);
  font-size: .5625rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ---- discography page (releases.html) ----------------------------- */
.works { padding-top: clamp(7rem, 16vh, 10rem); }

.works__group { margin-top: clamp(3rem, 6vw, 4.5rem); }
.works__group:first-of-type { margin-top: 0; }
.works__group > .tag-label { margin-bottom: 1.25rem; }

/* phone: cover + title on one row, the links drop to their own row */
.work {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: .5rem 1rem;
  align-items: center;
  padding: 1.1rem 0;
  border-bottom: 1px solid var(--hairline);
  transition: background .35s var(--ease), padding .35s var(--ease);
}
.work__links {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  gap: .4rem 1.25rem;
}
.work:first-of-type { border-top: 1px solid var(--hairline); }
@media (min-width: 720px) {
  .work { grid-template-columns: 88px minmax(0, 1fr) minmax(0, 12rem) auto; gap: 2rem; }
  .work:hover { background: rgba(255, 255, 255, .025); padding-inline: .75rem; }
  .work__links { grid-column: auto; justify-self: end; flex-wrap: nowrap; }
}

.work__cover {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: var(--panel);
}
.work__title { font-size: .9375rem; font-weight: 500; line-height: 1.35; }
.work__sub { font-size: .75rem; color: var(--dim); margin-top: .1rem; }
.work__meta {
  display: none;
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.work__meta em { font-style: normal; color: var(--muted); }
.work__meta span { color: var(--dim); margin-left: .6rem; }
@media (min-width: 720px) { .work__meta { display: block; } }

.works__back { margin-top: clamp(3rem, 6vw, 4.5rem); }

/* ---- reveal (JS adds .is-in; GSAP takes over when available) ------- */
.reveal, .card, html.js .is-in { opacity: 1; transform: none; }

/* GSAP drives these directly — the CSS transition would double-animate */
html.gsap .reveal,
html.gsap .card,
html.gsap .is-in { transition: none; }

/* ---- reduced motion ----------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  /* no dissolve to play out, so drop the pin rather than make the reader
     scroll a dead viewport past a frozen hero */
  .hero { min-height: 100svh; }
  .hero__stage { position: static; height: auto; min-height: 100svh; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  html.js .reveal,
  html.js .card { animation: none; }
  /* the ticker parks instead of snapping to its end frame */
  .ticker__track { animation: none; }
}

</style>
</head>

<script>
/* =============================================================
   KEYV — discography page
   Renders every release from config.js (plus localStorage
   overrides), grouped by type: releases, live mixes, video.
   ============================================================= */

(function () {
  'use strict';

  var STORAGE_KEY = 'keyv.config.overrides';
  document.documentElement.classList.add('js');

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  function merge(base, over) {
    if (!isPlainObject(base) || !isPlainObject(over)) {
      return over === undefined ? base : over;
    }
    var out = {}, k;
    for (k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k]; }
    for (k in over) {
      if (!Object.prototype.hasOwnProperty.call(over, k)) continue;
      out[k] = isPlainObject(base[k]) && isPlainObject(over[k]) ? merge(base[k], over[k]) : over[k];
    }
    return out;
  }

  var cfg = window.KEYV_CONFIG || {};
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) cfg = merge(cfg, JSON.parse(raw) || {});
  } catch (err) { /* defaults win */ }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function safeUrl(url) {
    if (typeof url !== 'string') return '';
    var trimmed = url.trim();
    if (!trimmed) return '';
    var scheme = trimmed.match(/^([a-z][a-z0-9+.-]*):/i);
    if (scheme && !/^(https?|mailto|data)$/i.test(scheme[1])) return '';
    return trimmed;
  }

  function extLink(url, label, className) {
    var href = safeUrl(url);
    var a = el('a', className, label);
    if (href) {
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
    return a;
  }

  var GROUPS = [
    { type: 'release', title: 'Label releases' },
    { type: 'mix',     title: 'Live mixes' }
  ];

  function workRow(release) {
    var row = el('article', 'work reveal');

    var cover = el('img', 'work__cover');
    cover.alt = '';
    cover.loading = 'lazy';
    cover.decoding = 'async';
    cover.src = safeUrl(release.cover) || '';
    cover.addEventListener('error', function () { cover.removeAttribute('src'); }, { once: true });
    row.appendChild(cover);

    var main = el('div');
    main.appendChild(el('h3', 'work__title', release.title || 'Untitled'));
    if (release.mix) main.appendChild(el('p', 'work__sub', release.mix));
    row.appendChild(main);

    var meta = el('p', 'work__meta');
    if (release.genre) meta.appendChild(el('em', null, '#' + String(release.genre).toLowerCase()));
    if (release.year) meta.appendChild(el('span', null, release.year));
    row.appendChild(meta);

    var links = el('div', 'work__links');
    (Array.isArray(release.links) ? release.links : []).forEach(function (l) {
      if (l && l.label) links.appendChild(extLink(l.url, l.label + ' ↗', 'action'));
    });
    row.appendChild(links);

    return row;
  }

  function render() {
    var host = document.getElementById('works');
    if (!host) return;
    host.textContent = '';

    var releases = Array.isArray(cfg.releases) ? cfg.releases : [];

    GROUPS.forEach(function (group) {
      var items = releases.filter(function (r) { return r && (r.type || 'release') === group.type; });
      if (!items.length) return;

      var section = el('div', 'works__group');
      section.appendChild(el('p', 'tag-label', group.title));
      items.forEach(function (r) { section.appendChild(workRow(r)); });
      host.appendChild(section);
    });

    /* footer bits shared with the main page */
    document.querySelectorAll('[data-config]').forEach(function (node) {
      var path = node.getAttribute('data-config').split('.');
      var value = path.reduce(function (a, k) { return a == null ? undefined : a[k]; }, cfg);
      if (typeof value === 'string' && value) node.textContent = value;
    });

    var navList = document.getElementById('nav-platforms');
    if (navList && Array.isArray(cfg.platforms)) {
      cfg.platforms.forEach(function (p) {
        if (!p || !p.label) return;
        var li = el('li');
        li.appendChild(extLink(p.url, p.label));
        navList.appendChild(li);
      });
    }

    var socials = document.getElementById('footer-socials');
    if (socials && Array.isArray(cfg.socials)) {
      cfg.socials.forEach(function (s) {
        if (!s || !s.label) return;
        var li = el('li');
        li.appendChild(extLink(s.url, s.label, 'link-grow'));
        socials.appendChild(li);
      });
    }

    /* simple reveal — no GSAP dependency on this page */
    var targets = Array.prototype.slice.call(document.querySelectorAll('.reveal, .work'));
    if (!('IntersectionObserver' in window)) {
      targets.forEach(function (node) { node.classList.add('is-in'); });
      return;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-in');
        io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -6% 0px' });
    targets.forEach(function (node) { io.observe(node); });

    /* A fast scroll can carry a row from below the viewport to above it
       between frames, so the observer never sees it intersect. Sweep
       anything already scrolled past. */
    var ticking = false;
    function sweep() {
      targets = targets.filter(function (node) {
        if (node.classList.contains('is-in')) return false;
        if (node.getBoundingClientRect().bottom > 0) return true;
        node.classList.add('is-in');
        io.unobserve(node);
        return false;
      });
      if (!targets.length) window.removeEventListener('scroll', onScroll);
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { sweep(); ticking = false; });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();

</script>
