  <defs>
    <!-- the rough, eaten edge of spray paint on a rough wall -->
    <filter id="spray" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="11" result="n"/>
